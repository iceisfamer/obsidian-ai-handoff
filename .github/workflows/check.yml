name: Check macOS beta
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm run release:prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ai-handoff-release-candidate
          path: dist/
